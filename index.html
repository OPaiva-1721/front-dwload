<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DWLOAD — Download videos & audio from any link</title>
    <meta name="description" content="Paste a link from YouTube, TikTok, Instagram, X, Vimeo or SoundCloud and save the video as MP4 or the audio as MP3." />
    <meta name="theme-color" content="#050508" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews (WhatsApp, iMessage, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DWLOAD — Download videos & audio from any link" />
    <meta property="og:description" content="Save videos as MP4 or audio as MP3 from YouTube, TikTok, Instagram, X and more." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts: preconnect + <link> instead of a CSS @import, so they're discovered with the HTML -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
