<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DWLOAD — Capture Any Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --card-bg: rgba(18, 14, 38, 0.85);
    --card-border: rgba(120, 90, 220, 0.25);
    --accent-purple: #a78bfa;
    --accent-teal: #2dd4bf;
    --accent-blue: #818cf8;
    --btn-active-bg: #3b2f7a;
    --btn-active-border: #7c5cdb;
    --launch-from: #7c3aed;
    --launch-to: #a78bfa;
    --text-primary: #f1f0ff;
    --text-muted: #8b8aaa;
    --text-dim: #4a4870;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    top: 0; left: 0;
    transform: translate(-50%, -50%);
  }
  #cursor .crosshair {
    width: 22px; height: 22px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  #cursor .crosshair::before,
  #cursor .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(167, 139, 250, 0.85);
    border-radius: 2px;
  }
  #cursor .crosshair::before { width: 1px; height: 14px; }
  #cursor .crosshair::after  { width: 14px; height: 1px; }
  #cursor .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent-teal);
    box-shadow: 0 0 8px var(--accent-teal);
    position: relative; z-index: 1;
  }
  #cursor .aura {
    position: absolute;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(167, 139, 250, 0.25);
    transform: translate(-50%, -50%);
    top: 50%; left: 50%;
    animation: aura-pulse 2s ease-in-out infinite;
  }
  @keyframes aura-pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.4; }
    50%      { transform: translate(-50%,-50%) scale(1.5); opacity: 0.08; }
  }

  /* CANVAS */
  canvas#stars {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
  }

  /* NEBULAE */
  .nebula {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 0; will-change: transform;
  }
  .neb-1 { width: 650px; height: 650px; background: radial-gradient(ellipse, rgba(76,29,149,0.38) 0%, transparent 70%); top: -8%; left: -10%; filter: blur(70px); }
  .neb-2 { width: 520px; height: 520px; background: radial-gradient(ellipse, rgba(6,78,59,0.32) 0%, transparent 70%); top: 18%; right: -7%; filter: blur(75px); }
  .neb-3 { width: 420px; height: 420px; background: radial-gradient(ellipse, rgba(30,27,75,0.42) 0%, transparent 70%); bottom: 8%; left: 22%; filter: blur(85px); }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 48px; z-index: 100;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Space Mono', monospace; font-size: 13px;
    letter-spacing: 0.12em; color: var(--text-primary); text-decoration: none;
  }
  .logo-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent-teal); box-shadow: 0 0 10px var(--accent-teal);
    animation: logo-pulse 2.4s ease-in-out infinite;
  }
  @keyframes logo-pulse {
    0%,100% { box-shadow: 0 0 8px var(--accent-teal); }
    50%      { box-shadow: 0 0 20px var(--accent-teal), 0 0 40px rgba(45,212,191,0.4); }
  }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a {
    font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 0.18em; color: var(--text-dim);
    text-decoration: none; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--text-primary); }

  /* HERO */
  .hero {
    position: relative; z-index: 10; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 120px 24px 60px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.3em; color: var(--text-muted);
    margin-bottom: 28px; animation: fadeUp 0.8s ease both;
  }
  .eyebrow-line { width: 40px; height: 1px; background: linear-gradient(to right, transparent, var(--text-muted)); }
  .eyebrow-line.right { background: linear-gradient(to left, transparent, var(--text-muted)); }

  /* GLITCH TITLE */
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(64px, 9vw, 130px);
    font-weight: 800; line-height: 0.95;
    margin-bottom: 24px;
    animation: fadeUp 0.8s ease 0.1s both;
  }
  h1 .line1 { color: #ffffff; display: block; }
  h1 .line2 {
    display: block;
    background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 60%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .glitch-active {
    animation: glitch 0.12s steps(1) forwards !important;
  }
  @keyframes glitch {
    0%   { filter: drop-shadow(2px 0 #2dd4bf) drop-shadow(-2px 0 #a78bfa); transform: translateX(0); }
    25%  { filter: drop-shadow(-3px 0 #2dd4bf) drop-shadow(3px 0 #a78bfa); transform: translateX(2px); }
    50%  { filter: drop-shadow(3px 0 #818cf8) drop-shadow(-3px 0 #2dd4bf); transform: translateX(-2px); }
    75%  { filter: drop-shadow(-2px 0 #a78bfa) drop-shadow(2px 0 #818cf8); transform: translateX(1px); }
    100% { filter: none; transform: translateX(0); }
  }

  .subtitle {
    font-size: 15px; color: var(--text-muted); font-weight: 300;
    letter-spacing: 0.02em; margin-bottom: 52px;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  /* AURORA CARD */
  .card-wrap {
    position: relative; width: 100%; max-width: 540px;
    animation: fadeUp 0.8s ease 0.3s both;
  }
  .aurora-border {
    position: absolute; inset: -1.5px;
    border-radius: 20px; z-index: -1;
    overflow: hidden;
  }
  .aurora-border::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, #7c3aed, #2dd4bf, #818cf8, #a78bfa, #7c3aed);
    animation: aurora-rot 4s linear infinite;
  }
  @keyframes aurora-rot { to { transform: rotate(360deg); } }
  .card {
    width: 100%; background: var(--card-bg); border-radius: 18px;
    padding: 32px; backdrop-filter: blur(24px);
    box-shadow: 0 0 60px rgba(100,60,200,0.12), 0 2px 40px rgba(0,0,0,0.6);
    position: relative;
  }

  /* FORMAT TOGGLE */
  .format-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .fmt-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px; border-radius: 10px; border: 1px solid transparent;
    background: transparent; color: var(--text-muted);
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.15em;
    cursor: none; transition: all 0.2s;
  }
  .fmt-btn:hover { color: var(--text-primary); border-color: var(--card-border); }
  .fmt-btn.active {
    background: var(--btn-active-bg); border-color: var(--btn-active-border);
    color: var(--text-primary); box-shadow: 0 0 20px rgba(124,92,219,0.3);
  }
  .fmt-btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* URL INPUT */
  .url-wrap { position: relative; margin-bottom: 18px; }
  .platform-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 15px; display: none; align-items: center; justify-content: center;
    color: var(--accent-teal); width: 20px;
  }
  .platform-icon.visible { display: flex; }
  .url-input {
    width: 100%; background: rgba(8,6,20,0.7);
    border: 1px solid rgba(100,80,200,0.2); border-radius: 10px;
    padding: 14px 18px; color: var(--text-muted);
    font-family: 'Space Mono', monospace; font-size: 12px;
    outline: none; cursor: none; transition: border-color 0.2s, box-shadow 0.2s, padding-left 0.2s;
  }
  .url-input.has-icon { padding-left: 42px; }
  .url-input::placeholder { color: var(--text-dim); }
  .url-input:focus {
    border-color: rgba(167,139,250,0.5);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.08);
    color: var(--text-primary);
  }

  /* QUALITY PILLS */
  .quality-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .q-pill {
    padding: 5px 14px; border-radius: 999px;
    border: 1px solid rgba(100,80,200,0.25);
    background: transparent; color: var(--text-dim);
    font-family: 'Space Mono', monospace; font-size: 11px; cursor: none; transition: all 0.2s;
  }
  .q-pill:hover { color: var(--text-muted); border-color: rgba(167,139,250,0.4); }
  .q-pill.active {
    background: rgba(45,212,191,0.12);
    border-color: var(--accent-teal); color: var(--accent-teal);
  }

  /* LAUNCH BTN */
  .launch-btn {
    width: 100%; padding: 18px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--launch-from), var(--launch-to));
    color: #fff; font-family: 'Space Mono', monospace;
    font-size: 12px; font-weight: 700; letter-spacing: 0.2em;
    cursor: none; display: flex; align-items: center; justify-content: center; gap: 10px;
    position: relative; overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 30px rgba(124,58,237,0.5);
  }
  .launch-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.2s;
  }
  .launch-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(124,58,237,0.7); }
  .launch-btn:hover::before { opacity: 1; }
  .launch-btn:active { transform: translateY(0); }
  .launch-btn.loading { pointer-events: none; opacity: 0.85; }

  /* PROGRESS */
  .progress-wrap {
    display: none; margin-top: 16px;
    background: rgba(8,6,20,0.7); border-radius: 999px; height: 4px; overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, var(--accent-teal), var(--accent-purple));
    border-radius: 999px; width: 0%; transition: width 0.3s;
  }
  .progress-wrap.active { display: block; }

  /* STATS */
  .stats { display: flex; margin-top: 48px; animation: fadeUp 0.8s ease 0.5s both; }
  .stat-item { flex: 1; text-align: center; padding: 0 24px; position: relative; }
  .stat-item + .stat-item::before {
    content: ''; position: absolute; left: 0; top: 10%; bottom: 10%;
    width: 1px; background: var(--card-border);
  }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: var(--text-primary); display: block; }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em; color: var(--text-dim); display: block; margin-top: 4px; }

  /* FOOTER */
  .footer-tag {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.3em;
    color: var(--text-dim); z-index: 10; display: flex; align-items: center; gap: 10px;
  }
  .footer-tag span { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-teal); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="cursor">
  <div class="crosshair">
    <div class="dot"></div>
    <div class="aura"></div>
  </div>
</div>

<canvas id="stars"></canvas>
<div class="nebula neb-1"></div>
<div class="nebula neb-2"></div>
<div class="nebula neb-3"></div>

<nav>

</nav>

<main class="hero">
  <div class="eyebrow">

  <h1>

  <p class="subtitle">Paste any URL. Choose your format. Launch into the void.</p>

  <div class="card-wrap">

      <div class="format-toggle">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>

      <div class="url-wrap">
        <span class="platform-icon" id="platformIcon"></span>

               placeholder="https://youtube.com/watch?v= ..."
               oninput="detectPlatform(this)">

      <div class="quality-row" id="qualityRow">

      <button class="launch-btn" id="launchBtn" onclick="launchDownload()">
        🚀 <span id="launchLabel">LAUNCH DOWNLOAD</span>

      <div class="progress-wrap" id="progressWrap">

  </div>

  <div class="stats">
    <div class="stat-item"><span class="stat-value">4K+</span><span class="stat-label">RESOLUTIONS</span></div>
    <div class="stat-item"><span class="stat-value">15+</span><span class="stat-label">PLATFORMS</span></div>
    <div class="stat-item"><span class="stat-value">&lt; 30s</span><span class="stat-label">AVG. TIME</span></div>
  </div>
</main>

<div class="footer-tag"><span></span>END-TO-END ENCRYPTED TRANSMISSION<span></span></div>

<script>
// ── CURSOR
const cursorEl = document.getElementById('cursor');
window.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});

// ── STARFIELD
(function() {
  const canvas = document.getElementById('stars');
  const ctx    = canvas.getContext('2d');
  let stars = [], shoots = [], ripples = [];
  const mouse = { x: -9999, y: -9999 };
  let prevX = 0, prevY = 0, mouseSpeed = 0, isHeld = false;

  const GR = 290, GF = 0.016, DAMP = 0.90, TRAIL = 7;

  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }

  function mkStar() {
    const ox = Math.random() * canvas.width;
    const oy = Math.random() * canvas.height;
    return {
      ox, oy, x: ox, y: oy, vx: 0, vy: 0,
      r: Math.random() * 1.4 + 0.2,
      o: Math.random() * 0.55 + 0.2,
      sp: Math.random() * 0.002 + 0.0008,
      ph: Math.random() * Math.PI * 2,
      trail: [],
      flare: Math.random() < 0.045
    };
  }

  function init() {
    resize();
    stars = Array.from({ length: 230 }, mkStar);
  }

  function shootingStar() {
    shoots.push({
      x: Math.random() * innerWidth * 0.7,
      y: Math.random() * innerHeight * 0.25,
      vx: 7 + Math.random() * 5,
      vy: 2.5 + Math.random() * 3,
      life: 1
    });
  }

  function draw(t) {
    // semi-clear for motion blur effect
    ctx.fillStyle = 'rgba(5,5,8,0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boost = Math.min(mouseSpeed * 0.004, 0.45);

    stars.forEach(s => {
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > TRAIL) s.trail.shift();

      const dx = mouse.x - s.x, dy = mouse.y - s.y;
      const d  = Math.sqrt(dx*dx + dy*dy);

      if (isHeld && d < GR * 1.6 && d > 0) {
        // spiral black hole
        const ang = Math.atan2(dy, dx);
        const sf  = (1 - d / (GR * 1.6)) * 0.07;
        s.vx += Math.cos(ang + 0.5) * sf * d * 0.013;
        s.vy += Math.sin(ang + 0.5) * sf * d * 0.013;
      } else if (d < GR && d > 0) {
        const str = (1 - d / GR) * GF;
        s.vx += dx * str; s.vy += dy * str;
      }

      // spring home
      s.vx += (s.ox - s.x) * 0.0038;
      s.vy += (s.oy - s.y) * 0.0038;

      // ripple forces
      ripples.forEach(rip => {
        const rdx = s.x - rip.x, rdy = s.y - rip.y;
        const rd  = Math.sqrt(rdx*rdx + rdy*rdy);
        const diff = Math.abs(rd - rip.radius);
        if (diff < 35) {
          const f   = (1 - diff / 35) * 2.0 * rip.str;
          const ang = Math.atan2(rdy, rdx);
          s.vx += Math.cos(ang) * f;
          s.vy += Math.sin(ang) * f;
        }
      });

      s.vx *= DAMP; s.vy *= DAMP;
      s.x  += s.vx; s.y  += s.vy;

      const alpha = s.o * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      const prox  = d < GR ? (1 - d / GR) * 0.5 : 0;
      const fa    = Math.min(1, alpha + prox * 0.42 + boost);
      const fr    = s.r + prox * 0.8;

      // trail
      s.trail.forEach((pt, i) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, s.r * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,180,255,${(i / TRAIL) * fa * 0.3})`;
        ctx.fill();
      });

      // star body
      ctx.beginPath();
      ctx.arc(s.x, s.y, fr, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(215,215,255,${fa})`;
      ctx.fill();

      // lens flare
      if (s.flare) {
        const arm = fr * 5.5;
        ctx.strokeStyle = `rgba(200,225,255,${fa * 0.5})`;
        ctx.lineWidth   = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x - arm, s.y); ctx.lineTo(s.x + arm, s.y);
        ctx.moveTo(s.x, s.y - arm); ctx.lineTo(s.x, s.y + arm);
        ctx.stroke();
      }
    });

    // shooting stars
    for (let i = shoots.length - 1; i >= 0; i--) {
      const ss = shoots[i];
      ss.x += ss.vx; ss.y += ss.vy; ss.life -= 0.017;
      if (ss.life <= 0) { shoots.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.vx * 12, ss.y - ss.vy * 12);
      g.addColorStop(0,   `rgba(255,255,255,${ss.life})`);
      g.addColorStop(0.4, `rgba(167,139,250,${ss.life * 0.45})`);
      g.addColorStop(1,   'rgba(167,139,250,0)');
      ctx.beginPath();
      ctx.moveTo(ss.x, ss.y);
      ctx.lineTo(ss.x - ss.vx * 12, ss.y - ss.vy * 12);
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.stroke();
    }

    // ripple rings
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.radius += 4.5; r.str *= 0.93; r.alpha -= 0.014;
      if (r.alpha <= 0) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(167,139,250,${r.alpha * 0.3})`;
      ctx.lineWidth   = 1; ctx.stroke();
    }

    requestAnimationFrame(draw);
  }

  setInterval(() => { if (Math.random() < 0.7) shootingStar(); }, 5000);

  window.addEventListener('resize', init);
  window.addEventListener('mousemove', e => {
    const dx = e.clientX - prevX, dy = e.clientY - prevY;
    mouseSpeed = Math.sqrt(dx*dx + dy*dy);
    prevX = mouse.x = e.clientX;
    prevY = mouse.y = e.clientY;
  });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener('click',     e => ripples.push({ x: e.clientX, y: e.clientY, radius: 0, alpha: 1, str: 1 }));
  window.addEventListener('mousedown', () => isHeld = true);
  window.addEventListener('mouseup',   () => isHeld = false);

  init();
  requestAnimationFrame(draw);
})();

// ── NEBULA PARALLAX
(function() {
  const layers = [
    { el: document.querySelector('.neb-1'), sx: 0.55, sy: 0.55 },
    { el: document.querySelector('.neb-2'), sx: -0.5, sy: -0.4 },
    { el: document.querySelector('.neb-3'), sx: 0.3,  sy: -0.45 }
  ];
  let bx = 0, by = 0, tx = 0, ty = 0;
  window.addEventListener('mousemove', e => {
    bx = (e.clientX / innerWidth  - 0.5) * 55;
    by = (e.clientY / innerHeight - 0.5) * 55;
  });
  (function loop() {
    tx += (bx - tx) * 0.03; ty += (by - ty) * 0.03;
    layers.forEach(l => {
      l.el.style.transform = `translate(${tx * l.sx}px, ${ty * l.sy}px)`;
    });
    requestAnimationFrame(loop);
  })();
})();

// ── GLITCH

  const el = document.getElementById('glitchTarget');

    setTimeout(() => el.classList.remove('glitch-active'), 140);

// ── PLATFORM DETECTION
const platforms = [
  { re: /youtube\.com|youtu\.be/, icon: '▶' },
  { re: /spotify\.com/,           icon: '♫' },
  { re: /twitter\.com|x\.com/,    icon: '𝕏' },
  { re: /instagram\.com/,         icon: '◈' },
  { re: /tiktok\.com/,            icon: '◉' },
  { re: /soundcloud\.com/,        icon: '☁' },
  { re: /vimeo\.com/,             icon: '◇' },
  { re: /twitch\.tv/,             icon: '◈' },
];

function detectPlatform(input) {
  const found = platforms.find(p => p.re.test(input.value));
  const icon  = document.getElementById('platformIcon');
  if (found) {
    icon.textContent = found.icon;
    icon.classList.add('visible');
    input.classList.add('has-icon');
  } else {
    icon.classList.remove('visible');
    input.classList.remove('has-icon');
  }
}

// ── FORMAT TOGGLE
const qualities = {
  video: ['2160p', '1080p', '720p', '480p'],
  audio: ['320kbps', '256kbps', '192kbps', '128kbps']
};
function setFormat(type) {
  document.getElementById('btnVideo').classList.toggle('active', type === 'video');
  document.getElementById('btnAudio').classList.toggle('active', type === 'audio');
  document.getElementById('qualityRow').innerHTML = qualities[type].map((q, i) =>
    `<button class="q-pill${i === 1 ? ' active' : ''}" onclick="setQuality(this)">${q}</button>`
  ).join('');
}
function setQuality(el) {
  document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
}

// ── LAUNCH
const states = ['CAPTURING SIGNAL...', 'ENCODING...', 'ALMOST THERE...', 'DONE ✓'];
function launchDownload() {
  const url = document.getElementById('urlInput').value.trim();
  const btn = document.getElementById('launchBtn');
  const lbl = document.getElementById('launchLabel');
  if (!url) {
    const inp = document.getElementById('urlInput');
    inp.style.borderColor = 'rgba(248,113,113,0.6)';
    setTimeout(() => inp.style.borderColor = '', 1200);
    return;
  }
  const pw = document.getElementById('progressWrap');
  const pb = document.getElementById('progressBar');
  pw.classList.add('active');
  btn.classList.add('loading');
  let p = 0, si = 0;
  lbl.textContent = states[0];
  const iv = setInterval(() => {
    p += Math.random() * 10 + 2;
    if (p >= 100) p = 100;
    pb.style.width = p + '%';
    const nsi = p < 30 ? 0 : p < 65 ? 1 : p < 92 ? 2 : 3;
    if (nsi !== si) { si = nsi; lbl.textContent = states[si]; }
    if (p >= 100) {
      clearInterval(iv);
      setTimeout(() => {
        pw.classList.remove('active');
        pb.style.width = '0%';
        btn.classList.remove('loading');
        lbl.textContent = 'LAUNCH DOWNLOAD';
      }, 1400);
    }
  }, 220);
}
